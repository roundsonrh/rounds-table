const D=[2317,9522,2272,5274,7595,294,6736,3852,198,7262,6732,302,6602,2497,309,1276,4111,440,7795,1585,315,3387,3461,285,2628,1881,350,8683,7317,257,740,7165,334,4816,6640,274,6589,9506,364,8968,960,267,3112,979,356,8728,8733,303,7512,172,303,1733,5958,356,7119,7551,382,9012,2349,213,9364,110,412,4573,4161,275,2305,6358,250,1030,7,315,400,3824,402,9660,5224,308,4880,8468,293,5373,1318,283,2120,969,316,7743,888,227,4218,6391,313,7802,5605,429,934,5039,268,4853,968,191,6498,6804,251,94,4522,258,6914,8803,332,4104,1303,198,6929,1888,203,194,5743,251,2736,2789,403,5343,3957,360,6734,870,308,9838,7745,192,7533,9849,418,4305,5010,277,9121,3923,408,1662,2335,315,1135,964,266,4199,2812,324],ID=888,P=16;

function frame(t){const T=(t/1000%P)/P*6.283,k=S/10000;g.fillStyle="#000";g.fillRect(0,0,S,S);g.fillStyle="#ccff00";g.beginPath();
