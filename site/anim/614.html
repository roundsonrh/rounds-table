<body><canvas id="c"></canvas><script>
// Rounds #614, breathing. Same circles as the still. Every 8 seconds the

const D=[9634,2420,431,3676,3019,135,30,7630,197,7858,426,458,2905,4195,405,6444,4028,254,1894,5771,149,9925,5174,459,8516,1796,389,3895,3945,334,9078,3336,385,7478,3478,358,1463,1173,301,163,4056,452,2068,4683,208,9160,6849,367,2682,1,335,6717,4936,134,723,866,470,3084,9834,419,2950,8517,287,196,1878,533,3778,855,494,3310,6165,512,9177,180,307,1891,9807,174,9746,861,234,6402,1600,474,6578,9772,156,9214,4983,251,6673,676,426,7558,8840,504,1544,9225,405,600,8465,416,3012,1462,449,8956,915,407,7191,7791,473,581,4945,280,3745,1972,362,1966,5459,134,839,6205,177,6423,9036,299,3862,9487,104,9138,5855,207,2184,8533,409,9940,9360,460,7093,6662,207,3402,7233,300,3052,4888,210,2909,677,136,8439,7372,352,1919,2048,316,3221,2790,280,9998,6241,405,7177,1981,158,8637,5871,276,6736,4605,125],ID=614,P=16,B=8;
let s=ID*9301+49297;const rnd=()=>((s=(s*233280+12345)%2147483647)/2147483647);
let cx=0,cy=0,w=0;for(let i=0;i<D.length;i+=3){const a=D[i+2]*D[i+2];cx+=D[i]*a;cy+=D[i+1]*a;w+=a;}cx/=w;cy/=w;
let far=1;for(let i=0;i<D.length;i+=3)far=Math.max(far,Math.hypot(D[i]-cx,D[i+1]-cy));
const C=[];for(let i=0;i<D.length;i+=3){const r=D[i+2],a=Math.min(160,30+12000/(r+40));
C.push({x:D[i],y:D[i+1],r,d:Math.hypot(D[i]-cx,D[i+1]-cy)/far,ax:a*(.5+rnd()*.5),ay:a*(.5+rnd()*.5),px:rnd()*6.283,py:rnd()*6.283});}
const cv=document.getElementById("c"),g=cv.getContext("2d");let S=0;
function fit(){const dpr=Math.min(devicePixelRatio||1,2);S=Math.min(innerWidth,innerHeight);cv.style.width=cv.style.height=S+"px";cv.width=cv.height=Math.round(S*dpr);g.setTransform(dpr,0,0,dpr,0,0);}

const ease=(u)=>u*u*(3-2*u);
function frame(t){const sec=t/1000%P,T=sec/P*6.283,k=S/10000;g.fillStyle="#000";g.fillRect(0,0,S,S);g.fillStyle="#ccff00";g.beginPath();
