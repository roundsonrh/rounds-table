const D=[5111,5774,374,6893,4580,610,6004,4021,192,2111,5270,519,781,4909,635,4212,5039,263,4977,3607,436,1179,3165,470,5051,2045,414,5950,6823,547,1799,2025,459,8427,5195,268,4049,7677,248,3490,2567,281,7444,2884,318,3961,9553,391,8529,6798,253,6925,2179,290,6737,8864,373,3967,4160,444,5009,8457,499,7369,7867,518,6675,5878,341,1981,7752,495,3101,8690,337,5404,4639,531,3139,6505,454,2492,3770,524,8010,6553,195,8801,6011,230,6007,1704,341,3447,4883,204,1258,6495,568,4900,7020,329,3798,6990,188,898,2376,145,8221,3127,264,378,3831,368,5963,3440,193,4245,5692,233,3938,8661,363,8780,4230,288,3947,1662,316],ID=102,P=16;

C.push({x:D[i],y:D[i+1],r,ax:a*(.5+rnd()*.5),ay:a*(.5+rnd()*.5),fx:1+(rnd()*2|0),fy:1+(rnd()*2|0),px:rnd()*6.283,py:rnd()*6.283,pb:rnd()*6.283});}
