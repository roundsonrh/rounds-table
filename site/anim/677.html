const D=[5430,5472,474,7446,8936,100,4355,3345,252,5324,4723,50,2890,768,71,2504,20,60,7473,8100,50,3699,1739,606,3506,3148,49,5197,6237,50,6193,9521,50,6862,7181,50,4767,2091,255,5819,8669,50,6610,5537,641,7993,9830,66,3622,5023,1072,5706,6299,50,5290,3357,120,7310,8569,50,6868,7844,513,1995,1540,940,5772,6945,542,6159,8704,84,3396,2448,83,4776,8260,104,6066,7762,151,3781,2851,190,2679,3135,657,8093,9173,153,2145,127,155,3235,176,543,4990,4565,250,6112,9763,128,6964,9359,432,1127,2907,424,7921,8013,49],ID=677,P=16;
