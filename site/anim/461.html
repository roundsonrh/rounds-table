const D=[3308,7702,2353,0,5160,1373,9177,4275,1258,4973,4634,993,3240,272,942,1663,2672,1156,6545,1748,1429,7248,6580,1158,2331,4544,794,4260,2540,769,6796,8977,478,6611,3749,340,4674,795,423,8461,2660,382,3310,3657,278,5695,9471,485,9205,6474,533,6799,4500,376,6437,7905,184,8443,7853,408,3239,1816,426,5348,3212,346,7198,3786,213,465,7217,380,3159,3163,207,7640,4393,218,3494,4949,292,6205,5120,227,6052,5678,270,6073,7435,165,2437,1311,321,5976,7895,242,7767,8416,311],ID=461,P=16;
