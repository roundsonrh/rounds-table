<body><canvas id="c"></canvas><script>

const D=[335,966,630,3685,9416,50,4102,5980,421,5445,6594,586,8972,1914,50,1620,6413,661,8357,8462,281,9443,3620,327,6187,1346,117,8865,4231,67,8988,7060,55,4199,1147,677,389,4326,103,1966,4387,50,8228,4072,50,1058,9433,1005,4474,8959,49,6085,3255,49,7717,1253,50,5750,1615,50,5616,9396,50,1391,222,67,8636,407,348,1334,3513,586,2997,4034,896,7220,5816,1006,8250,2889,50,9683,5668,67,9008,4737,74,5333,1899,295,6007,7952,190,2721,8006,824,9552,1333,562,9764,9049,984,1430,8140,85,7817,9584,455,3521,621,50,5772,8975,158,1940,1326,324,5647,5308,341,3275,1118,70,6028,652,50,2853,1901,50,6921,8493,500,1910,2005,47,4397,4547,452,4481,8448,305,696,4452,47,3498,9248,50,8437,2264,155,6790,1559,49,371,7888,402,838,2166,472,8961,6242,347],ID=93,P=16,B=8;
let s=ID*9301+49297;const rnd=()=>((s=(s*233280+12345)%2147483647)/2147483647);
let cx=0,cy=0,w=0;for(let i=0;i<D.length;i+=3){const a=D[i+2]*D[i+2];cx+=D[i]*a;cy+=D[i+1]*a;w+=a;}cx/=w;cy/=w;
let far=1;for(let i=0;i<D.length;i+=3)far=Math.max(far,Math.hypot(D[i]-cx,D[i+1]-cy));
const C=[];for(let i=0;i<D.length;i+=3){const r=D[i+2],a=Math.min(160,30+12000/(r+40));
C.push({x:D[i],y:D[i+1],r,d:Math.hypot(D[i]-cx,D[i+1]-cy)/far,ax:a*(.5+rnd()*.5),ay:a*(.5+rnd()*.5),px:rnd()*6.283,py:rnd()*6.283});}
const cv=document.getElementById("c"),g=cv.getContext("2d");let S=0;

function frame(t){const sec=t/1000%P,T=sec/P*6.283,k=S/10000;g.fillStyle="#000";g.fillRect(0,0,S,S);g.fillStyle="#ccff00";g.beginPath();
