const D=[2070,7103,1750,5247,4812,812,2271,3246,1187,9511,4361,191,4129,4580,49,7369,4468,200,3919,8738,50,8955,6717,1659,5610,8949,188,5615,6731,458,3892,5885,50,4730,2197,124,3624,2341,85,3817,5488,221,6582,6023,269,6742,3081,716,7242,5247,388,3992,2444,46,4427,6391,551,9011,2567,1018,6578,8798,142,4824,8965,48,5595,2334,48,1694,4878,183,7108,8548,319,9521,3778,117,5186,2131,196,3600,8508,206,6272,6487,80,3882,4727,49,6026,2530,42,7620,8128,149],ID=821,P=16;
let s=ID*9301+49297;const rnd=()=>((s=(s*233280+12345)%2147483647)/2147483647);
