<body><canvas id="c"></canvas><script>
// Rounds #300, breathing. Same circles as the still. Every 8 seconds the
// whole piece inhales (circles swell and spread from its center) and
// exhales; the breath ripples outward, so the middle moves first. A small

const D=[4157,4194,148,2842,3373,415,4658,9588,1041,1075,5304,537,6373,2876,736,5052,5096,909,2997,5733,580,7380,9037,942,8789,4681,684,8292,1244,732,5218,6634,272,2505,1044,263,4515,7693,706,7983,6791,858,9947,5970,404,4092,2592,932,1061,6949,232,5931,803,530,4862,266,382,6396,6990,600,3566,4458,286,1957,2495,631,2733,7945,687,8657,8236,422,6962,4888,532,5658,8374,317,1909,6659,519,3968,528,158,5402,1896,388,4001,6055,257,2445,4360,515,8608,2676,613,6172,5715,159,9345,7520,448,3575,6910,245,5536,7103,130,6818,1333,321,3195,1529,272,7871,3553,389,9484,3646,307,1002,4148,271,4604,1283,261,6859,5872,297,6524,3958,217,5833,3886,164,9097,5919,302,4569,6542,262,5239,3445,214,3656,8628,145,7621,5649,214,2072,5269,133,7458,2705,125,9806,4354,197,4971,3894,154,6265,7991,84,3630,1060,188,2863,6840,245,5923,6180,139,8288,5575,81,3685,5106,193,1342,3563,161,6888,7803,170,2850,2277,108,9587,5252,135,7121,3713,244,9454,2497,108,9945,4891,134,931,2724,99,6097,1675,94,7783,5030,161,4431,3846,151],ID=300,P=16,B=8;
let s=ID*9301+49297;const rnd=()=>((s=(s*233280+12345)%2147483647)/2147483647);
let cx=0,cy=0,w=0;for(let i=0;i<D.length;i+=3){const a=D[i+2]*D[i+2];cx+=D[i]*a;cy+=D[i+1]*a;w+=a;}cx/=w;cy/=w;
let far=1;for(let i=0;i<D.length;i+=3)far=Math.max(far,Math.hypot(D[i]-cx,D[i+1]-cy));
const C=[];for(let i=0;i<D.length;i+=3){const r=D[i+2],a=Math.min(160,30+12000/(r+40));
C.push({x:D[i],y:D[i+1],r,d:Math.hypot(D[i]-cx,D[i+1]-cy)/far,ax:a*(.5+rnd()*.5),ay:a*(.5+rnd()*.5),px:rnd()*6.283,py:rnd()*6.283});}
const cv=document.getElementById("c"),g=cv.getContext("2d");let S=0;
function fit(){const dpr=Math.min(devicePixelRatio||1,2);S=Math.min(innerWidth,innerHeight);cv.style.width=cv.style.height=S+"px";cv.width=cv.height=Math.round(S*dpr);g.setTransform(dpr,0,0,dpr,0,0);}
addEventListener("resize",fit);fit();
const ease=(u)=>u*u*(3-2*u);
function frame(t){const sec=t/1000%P,T=sec/P*6.283,k=S/10000;g.fillStyle="#000";g.fillRect(0,0,S,S);g.fillStyle="#ccff00";g.beginPath();
