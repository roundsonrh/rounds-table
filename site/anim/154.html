<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rounds #154</title><style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{display:block;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}
#tabs{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(0,0,0,.72);font:11px/1 ui-monospace,Menlo,monospace;transition:opacity .4s;white-space:nowrap;max-width:96vw;overflow-x:auto;scrollbar-width:none}
#tabs button{all:unset;cursor:pointer;padding:6px 9px;border-radius:999px;color:var(--fg);opacity:.75}
#tabs button.on{background:var(--fg);color:var(--bg);opacity:1}
#tabs button.lock{cursor:default;opacity:.35}
#tabs.hide{opacity:0;pointer-events:none}
@media(max-width:520px){#tabs{font-size:9.5px;gap:2px;padding:3px;bottom:6px}#tabs button{padding:5px 6px}#tabs .soon{display:none}}</style></head>
<body><canvas id="c"></canvas><div id="tabs"></div><script>
// Rounds #154, alive. Every stage a holder has earned plays stacked ("All"),
// or one at a time from the tabs. ?s = stage earned (days held: 20, 40, 60),
// ?h = held since (unix seconds), for the countdown on locked tabs.
//  20 Breathing     an 8s inhale/exhale rippling out from the center, with a slow drift
//  40 Outlining  every circle hollows to an outline and fills back in (16s wave)
//  60 Rippling      each breath sends three faint rings out from the bigger circles
const D=[1191,2987,1158,2789,3656,232,5250,6120,58,5150,855,74,6798,3540,240,3620,4787,50,2893,4575,326,3228,7500,1467,4925,3059,1365,3477,480,1423,7935,2879,625,6560,313,49,5944,6535,631,2683,5389,425,5390,5007,361,692,6469,750,5663,8446,682,2795,3094,90,4550,5090,49,6787,1764,841,7517,5665,989,893,4716,49,4053,5591,390,4964,5563,49,4343,4756,50,6730,6785,114,4322,9489,397,7421,7115,225,1807,4709,530,4770,5005,45,8961,683,1195,4676,6109,92,452,859,502,8071,4112,280,7647,1012,88,9053,5156,435,3401,4973,177,4600,4602,145,5774,5515,50,7280,321,463,6397,4191,300,4544,6390,47,9723,3472,710,8000,8002,355,3588,9366,114,3538,4332,301,4922,6383,58,1739,6418,191,6612,2962,264,4042,4421,101,3256,2840,248,8733,7403,214,5772,778,453,1673,5428,87,6222,5128,220,3553,5597,49,6807,7491,199,5746,4308,49,2352,1689,137,6272,5514,78,5136,6834,42,5127,7310,373,2887,2322,206,6230,7362,157],ID=154,P=16,B=8;
const BG="#000",FG="#ccff00";
const Q=new URLSearchParams(location.search),ST=+(Q.get("s")||20),SINCE=+(Q.get("h")||0);
document.documentElement.style.setProperty("--fg",FG);document.documentElement.style.setProperty("--bg",BG);
let s=ID*9301+49297;const rnd=()=>((s=(s*233280+12345)%2147483647)/2147483647);
let cx=0,cy=0,w=0;for(let i=0;i<D.length;i+=3){const a=D[i+2]*D[i+2];cx+=D[i]*a;cy+=D[i+1]*a;w+=a;}cx/=w;cy/=w;
let far=1;for(let i=0;i<D.length;i+=3)far=Math.max(far,Math.hypot(D[i]-cx,D[i+1]-cy));
const C=[];for(let i=0;i<D.length;i+=3){const r=D[i+2],a=Math.min(160,30+12000/(r+40));
C.push({x:D[i],y:D[i+1],r,d:Math.hypot(D[i]-cx,D[i+1]-cy)/far,ax:a*(.5+rnd()*.5),ay:a*(.5+rnd()*.5),px:rnd()*6.283,py:rnd()*6.283});}
const BIG=C.map(c=>c.r).sort((a,b)=>a-b)[Math.floor(C.length*.6)]||0;
const cv=document.getElementById("c"),g=cv.getContext("2d");let S=0;
function fit(){const dpr=Math.min(devicePixelRatio||1,2);S=Math.min(innerWidth,innerHeight);cv.style.width=cv.style.height=S+"px";cv.width=cv.height=Math.round(S*dpr);g.setTransform(dpr,0,0,dpr,0,0);tabs.classList.toggle("hide",S<240);}
const ease=(u)=>u*u*(3-2*u);
// stages and tabs
const STAGES=[[0,"Still"],[20,"Breathing"],[40,"Outlining"],[60,"Rippling"],[80,"Day 80"]];
const MODES={all:{br:ST>=20,ho:ST>=40,ri:ST>=60},0:{},20:{br:1},40:{br:1,ho:1},60:{br:1,ri:1}};
let mode=MODES.all;
const tabs=document.getElementById("tabs");
function left(d){if(!SINCE)return"day "+d;const n=Math.ceil(d-(Date.now()/1000-SINCE)/86400);return n<=1?"tomorrow":"in "+n+"d";}
function drawTabs(){tabs.innerHTML="";const add=(label,key,locked)=>{const b=document.createElement("button");b.textContent=label;
if(locked)b.className="lock";else{if(mode===MODES[key])b.className="on";b.onclick=()=>{mode=MODES[key];drawTabs();};}tabs.appendChild(b);};
add("All","all");for(const [d,n] of STAGES){if(d===80){add(n+" ?","x",true);tabs.lastChild.classList.add("soon");continue;}add(ST>=d?n:n+" "+left(d),d,ST<d);}}
drawTabs();addEventListener("resize",fit);fit();
let idle=0;const wake=()=>{if(S>=240)tabs.classList.remove("hide");clearTimeout(idle);idle=setTimeout(()=>tabs.classList.add("hide"),3500);};
addEventListener("pointermove",wake);addEventListener("pointerdown",wake);wake();
function frame(t){const sec=t/1000%P,T=sec/P*6.283,k=S/10000,M=mode;g.fillStyle=BG;g.fillRect(0,0,S,S);
const G=C.map(c=>{if(!M.br)return[c.x*k,c.y*k,c.r*k,c.d,c.r>=BIG];const b=ease((1-Math.cos(sec/B*6.283-c.d*1.2))/2),sp=1+.07*b;
return[(cx+(c.x-cx)*sp+c.ax*Math.sin(T+c.px))*k,(cy+(c.y-cy)*sp+c.ay*Math.cos(T+c.py))*k,c.r*(.94+.2*b)*k,c.d,c.r>=BIG];});
if(M.ri){g.strokeStyle=FG;g.lineWidth=Math.max(.8,S/600);for(const [x,y,r,d,big] of G){if(!big)continue;for(const lag of [0,1/3,2/3]){const p=(((sec/B-d*1.2/6.283+lag)%1)+1)%1,rr=r*(1.04+.9*p),a=.7*Math.pow(1-p,1.5);
if(a<.06||rr<2)continue;g.globalAlpha=a;g.beginPath();g.arc(x,y,rr,0,6.283);g.stroke();}}g.globalAlpha=1;}
g.fillStyle=FG;
if(!M.ho){g.beginPath();for(const [x,y,r] of G){g.moveTo(x+r,y);g.arc(x,y,r,0,6.283);}g.fill();}
else for(const [x,y,r,d] of G){g.fillStyle=FG;g.beginPath();g.arc(x,y,r,0,6.283);g.fill();
const h=ease((1-Math.cos(T-d*2))/2),hole=Math.max(0,(r-Math.max(r*.12,1.5))*h);if(hole>Math.max(1.5,r*.15)){g.fillStyle=BG;g.beginPath();g.arc(x,y,hole,0,6.283);g.fill();}}
requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script></body></html>
