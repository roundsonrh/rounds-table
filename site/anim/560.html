<body><canvas id="c"></canvas><script>

const D=[6477,3984,91,3797,4816,254,7232,3017,61,5602,4695,78,5770,6337,187,6634,3132,181,4089,3295,50,8085,3867,245,5638,8136,77,7464,5998,153,6107,3466,154,3271,5942,259,7409,5537,116,5371,5716,141,7151,5224,140,5284,4707,106,4959,7367,198,4594,5184,256,5320,6949,186,2904,4506,119,4818,3889,86,2863,2358,188,4465,2840,134,5576,5032,127,5250,2795,127,6336,6076,232,5300,3210,88,4905,6440,244,7991,5667,127,2459,5326,253,3437,6533,247,6234,5524,202,4651,4169,101,4566,6919,212,6762,6478,237,6130,1046,77,3494,5223,183,4994,5508,97,4881,2302,256,6849,7495,141],ID=560,P=16;
let s=ID*9301+49297;const rnd=()=>((s=(s*233280+12345)%2147483647)/2147483647);

C.push({x:D[i],y:D[i+1],r,ax:a*(.5+rnd()*.5),ay:a*(.5+rnd()*.5),fx:1+(rnd()*2|0),fy:1+(rnd()*2|0),px:rnd()*6.283,py:rnd()*6.283,pb:rnd()*6.283});}

function frame(t){const T=(t/1000%P)/P*6.283,k=S/10000;g.fillStyle="#000";g.fillRect(0,0,S,S);g.fillStyle="#ccff00";g.beginPath();
