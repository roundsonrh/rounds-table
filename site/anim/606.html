const D=[2422,134,2510,8085,4373,98,2452,3812,177,5046,5581,115,6049,7386,141,4077,5342,117,6309,673,100,6238,3138,158,3935,6607,169,9786,4282,117,9731,9242,197,5414,880,167,4452,8392,99,7935,3612,165,4265,6957,204,7425,3911,103,1670,3619,119,4168,5002,103,488,2081,159,8348,5305,105,9063,3313,109,8538,1569,144,9225,1419,223,4392,9803,95,1261,9780,182,1191,5893,147,6761,73,187,4126,9575,159,5442,6698,181,8013,535,204,1724,7052,112,191,6694,178,7083,9663,148,5808,3367,180,7198,688,154,2699,9757,99,2341,8286,142,3959,9929,150,7225,3139,124,4451,4159,193,8442,2456,221,8620,7665,200,3473,9270,210],ID=606,P=16;
