const D=[6028,591,2705,1836,2304,259,9039,5440,233,5542,5964,155,3025,130,256,6183,5633,201,8429,8532,132,3297,9558,225,9557,2859,197,2396,8578,112,7811,7583,211,3018,1784,173,8774,8783,149,3362,8136,177,655,4559,149,4305,6322,142,2199,6255,183,6252,4735,140,251,1024,139,9704,4231,205,1892,7974,205,1609,3558,216,7247,6077,192,4876,5823,150,1967,457,131,8717,5169,160,7905,4064,205,3775,7545,123,6194,8724,208,9301,6640,211,7713,4677,166,77,4617,196,6870,3895,219,1127,9648,194,9162,25,113,3338,7554,124,9052,3491,117,7141,9389,223,2822,8708,231,9935,6803,199,2714,7890,249,752,2301,220,5827,3636,155,2715,6056,240,19,397,204,8372,8143,172,6765,8552,134,7109,5325,111,128,8475,238,2571,3180,171,4593,5609,139],ID=752,P=16,B=8;
let s=ID*9301+49297;const rnd=()=>((s=(s*233280+12345)%2147483647)/2147483647);
let cx=0,cy=0,w=0;for(let i=0;i<D.length;i+=3){const a=D[i+2]*D[i+2];cx+=D[i]*a;cy+=D[i+1]*a;w+=a;}cx/=w;cy/=w;
let far=1;for(let i=0;i<D.length;i+=3)far=Math.max(far,Math.hypot(D[i]-cx,D[i+1]-cy));
const C=[];for(let i=0;i<D.length;i+=3){const r=D[i+2],a=Math.min(160,30+12000/(r+40));
C.push({x:D[i],y:D[i+1],r,d:Math.hypot(D[i]-cx,D[i+1]-cy)/far,ax:a*(.5+rnd()*.5),ay:a*(.5+rnd()*.5),px:rnd()*6.283,py:rnd()*6.283});}
