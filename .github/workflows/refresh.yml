name: Refresh holders

# Every 2 hours. Runs at 00/06/12/18 UTC are full (who holds what + what they
# collect, ~25 min); the rest are quick (owners and hold times). Floor prices
# refresh on every run (~18 min).
# "Run workflow" on the Actions tab runs one by hand.
on:
  schedule:
    - cron: "7 */2 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "full or quick"
        default: full

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pick full or quick
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            H=$(date -u +%H); if [ $((10#$H % 6)) -eq 0 ]; then MODE=full; else MODE=quick; fi
          fi
          echo "MODE=$MODE" >> "$GITHUB_ENV"
          echo "Mode: $MODE"

      - name: Pull holder data (chain + OpenSea)
        env:
          OPENSEA_API_KEY: ${{ secrets.OPENSEA_API_KEY }}
        run: node scripts/refresh.mjs

      - name: Floor prices (OpenSea)
        env:
          OPENSEA_API_KEY: ${{ secrets.OPENSEA_API_KEY }}
        run: node scripts/floors.mjs || echo "floors skipped — keeping the last ones"

      - name: Moving Rounds (held 20+ days)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/moving.mjs compute || echo "moving list skipped"

      - name: Holiday art (site/art, built fresh each run)
        run: node scripts/build-themes.mjs

      - name: Publish to roundsonrh.com
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SITE_WORKER: ${{ vars.SITE_WORKER }}
        run: node scripts/deploy.mjs

      - name: Tell OpenSea which Rounds started or stopped moving
        env:
          OPENSEA_API_KEY: ${{ secrets.OPENSEA_API_KEY }}
        run: node scripts/moving.mjs refresh || echo "refresh skipped"

      - name: Holiday colors (only does anything if the theme changed)
        env:
          OPENSEA_API_KEY: ${{ secrets.OPENSEA_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/theme.mjs || echo "theme sync skipped"

      - name: Keep today's snapshot (for the holder update tweet)
        if: env.MODE == 'full'
        run: |
          git config user.name "rounds-bot"
          git config user.email "rounds-bot@users.noreply.github.com"
          git add history
          git commit -m "holder snapshot $(date -u +%F)" || echo "nothing new"
          git push || echo "couldn't push the snapshot (not fatal)"
