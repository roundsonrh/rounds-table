name: Refresh holders

# Every 6 hours, plus a "Run workflow" button on the Actions tab.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pull holder data (chain + OpenSea)
        env:
          OPENSEA_API_KEY: ${{ secrets.OPENSEA_API_KEY }}
        run: node scripts/refresh.mjs

      - name: Publish to roundsonrh.com
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ vars.PAGES_PROJECT }}
        run: node scripts/deploy.mjs

      - name: Keep today's snapshot (for the holder update tweet)
        run: |
          git config user.name "rounds-bot"
          git config user.email "rounds-bot@users.noreply.github.com"
          git add history
          git commit -m "holder snapshot $(date -u +%F)" || echo "nothing new"
          git push || echo "couldn't push the snapshot (not fatal)"
